<!doctype html>
<html lang="en">
  <head>
    <title>Durak</title>
  </head>
  <body>
    <h1 class="message">Welcome to the Main Page</h1>
    <div class="attack"></div>
    <div class="hand"></div>
    <div class="message"></div>
  </body>
  <style>
    .message {
      text-align: center;
      font-size: 24px;
      color: #333;
    }
    .card {
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.2);
    }
    .hand{
      text-align: center;
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 10px;
    }
    .attack{
      text-align: center;
      transform: translateY(50%);
      padding: 10px;
    }
  </style>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</html>
